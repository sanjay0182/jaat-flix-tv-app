name: Build JaatPlay TV APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # if the repo holds only the zip (not the extracted files), it is extracted here first
      - name: Extract zip if needed
        run: |
          if [ -z "$(find . -name settings.gradle.kts -not -path "*/.git/*" | head -1)" ]; then
            Z=$(find . -maxdepth 2 -name "*.zip" -not -path "*/.git/*" | head -1)
            if [ -n "$Z" ]; then
              echo "Extracting $Z"
              mkdir -p _unzipped && unzip -q -o "$Z" -d _unzipped
            fi
          fi

      # finds the project folder by itself (works if the zip was pushed as a sub-folder too)
      - name: Find project
        run: |
          F=$(find . -name settings.gradle.kts -not -path "*/.git/*" | head -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts NOT FOUND. Files in the repo:"; ls -R | head -60; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$F")"
          ls -la "$(dirname "$F")"

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --console=plain

      - name: Rename APK
        run: |
          mkdir -p out
          cp "$PROJECT_DIR"/app/build/outputs/apk/debug/*.apk out/JaatPlay-TV.apk
          ls -la out

      # 1) Actions -> run -> Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: JaatPlay-TV-apk
          path: out/JaatPlay-TV.apk

      # 2) Releases (direct download link)
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/JaatPlay-TV.apk \
            --title "JaatPlay TV (latest build)" \
            --notes "Auto build from commit ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
